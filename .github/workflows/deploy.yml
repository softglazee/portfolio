name: Deploy portfolio to azhar.softglaze.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install
        run: npm install --legacy-peer-deps

      # Required. Lint failures must not reach the site.
      - name: Lint
        run: npm run lint

      # No CI=false. A warning that would fail CI should fail CI.
      - name: Build
        run: npm run build

      - name: Compress build output
        run: cd dist && zip -r ../upload.zip .

      - name: Upload to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: upload.zip
          target: ~

      # Extract to a staging directory and swap only once it is known good, so a
      # failed unzip can never leave the live site emptied.
      - name: Extract and swap
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail
            TARGET="$HOME/domains/softglaze.com/public_html/azhar"
            if [ ! -d "$TARGET" ]; then
              echo "ERROR: $TARGET does not exist on $(hostname) as $(whoami)."
              ls "$HOME/domains/" 2>/dev/null || true
              exit 1
            fi
            STAGE="$HOME/.deploy-stage-$$"
            rm -rf "$STAGE" && mkdir -p "$STAGE"
            unzip -q -o ~/upload.zip -d "$STAGE"
            test -f "$STAGE/index.html"
            # Only now is the live directory touched.
            find "$TARGET" -mindepth 1 -delete
            cp -a "$STAGE"/. "$TARGET"/
            rm -rf "$STAGE" ~/upload.zip
            test -f "$TARGET/index.html"
            echo "Deployed to $TARGET"

      - name: Verify the site is serving the build
        run: |
          sleep 5
          BODY=$(curl -sL --max-time 30 https://azhar.softglaze.com/)
          echo "$BODY" | grep -q "Default page" && { echo "ERROR: still the Hostinger default page"; exit 1; }
          echo "$BODY" | grep -o '<title>[^<]*</title>'
          echo "Live."
